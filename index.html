<style>
  :root {
    --ink:        #1a1815;
    --ink-2:      #2c2924;
    --ink-3:      #4a463f;
    --paper:      #ebe8e2;
    --paper-2:    #e3dfd6;
    --paper-3:    #d8d3c7;
    --line:       #c2bcad;
    --line-soft:  #d3cfc6;
    --accent:        #8a3324;
    --accent-2:      #c25a3c;
    --surface-dark:  #1f2c3d;
    --serif: "Newsreader", "Iowan Old Style", "Charter", Georgia, serif;
    --sans:  "Inter Tight", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    --mono:  "JetBrains Mono", ui-monospace, Menlo, monospace;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  ::selection { background: var(--ink); color: var(--paper); }

  .mono { font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); }
  .serif { font-family: var(--serif); }
  .rule { height: 1px; background: var(--line); border: 0; margin: 0; }

  .wrap { max-width: 1280px; margin: 0 auto; padding: 0 48px; }
  @media (max-width: 720px) { .wrap { padding: 0 24px; } }

  .btn {
    display: inline-flex; align-items: center; gap: 10px;
    font-family: var(--sans);
    font-size: 14px; font-weight: 500;
    letter-spacing: 0.01em;
    padding: 14px 22px;
    border: 1px solid var(--ink);
    background: var(--ink); color: var(--paper);
    cursor: pointer; text-decoration: none;
    transition: background 160ms ease, color 160ms ease;
  }
  .btn:hover { background: var(--accent); border-color: var(--accent); }
  .btn .arrow { transition: transform 160ms ease; }
  .btn:hover .arrow { transform: translateX(3px); }

  a { color: inherit; }

  html { scroll-behavior: smooth; }

  body::before {
    content: "";
    position: fixed; inset: 0;
    background-image: radial-gradient(rgba(26,24,21,0.025) 1px, transparent 1px);
    background-size: 3px 3px;
    pointer-events: none;
    z-index: 1;
    mix-blend-mode: multiply;
  }

  #root { position: relative; z-index: 2; }

  .fade-section {
    opacity: 0;
    transform: translateY(28px);
    transition: opacity 0.65s ease, transform 0.65s ease;
  }
  .fade-section.visible {
    opacity: 1;
    transform: translateY(0);
  }

  .pattern-row {
    transition: background 200ms ease, box-shadow 200ms ease;
  }
  .pattern-row:hover {
    background: var(--paper-2);
    box-shadow: 0 4px 24px rgba(26,24,21,0.07);
  }

  @media (max-width: 900px) {
    .hero-grid   { grid-template-columns: 1fr !important; gap: 48px !important; }
    .pillar-grid { grid-template-columns: 1fr !important; }
    .criteria-grid { grid-template-columns: 1fr !important; }
    .audit-grid  { grid-template-columns: 1fr !important; }
    .complete-grid { grid-template-columns: 1fr !important; }
    .process-grid  { grid-template-columns: 1fr !important; }
  }

  @media (max-width: 600px) {
    .nav-links { display: none !important; }
    .nav-inner { padding: 14px 20px !important; }

    section { padding-top: 72px !important; padding-bottom: 72px !important; }
    footer  { padding-top: 72px !important; padding-bottom: 32px !important; }

    .hero-meta { flex-direction: column !important; gap: 4px !important; margin-bottom: 28px !important; }
    .hero-tagline { display: none !important; }
    section#top { padding-top: 36px !important; padding-bottom: 64px !important; }
    .hero-meta  { margin-bottom: 24px !important; }
    #hero-grid  { margin-top: 40px !important; gap: 36px !important; }
    section#top h1 { font-size: 38px !important; }

    .audit-inner { padding: 32px 20px 20px !important; }
    .audit-nav   { padding: 14px 20px !important; }
    .audit-sticky { position: static !important; }

    .criteria-item { padding: 32px 0 !important; border-left: none !important; padding-left: 0 !important; }

    .premise-grid { grid-template-columns: 1fr !important; gap: 24px !important; }
    .premise-grid > div:first-child { display: none !important; }

    .pattern-row { grid-template-columns: 40px 1fr !important; gap: 8px 16px !important; }
    .patterns-body { grid-column: 1 / -1 !important; padding-top: 4px; }

    .pillar-figure { display: none !important; }

    .process-step { grid-template-columns: 1fr !important; }
  }
</style>

<script type="text/babel">
const { useState, useEffect, useRef, useMemo } = React;

/* ─── Shared atoms ─────────────────────────────────────────────────────────── */

function SectionLabel({ num, label }) {

  );
}

/* ─── Nav ──────────────────────────────────────────────────────────────────── */

function TopNav() {

/* ─── Hero ─────────────────────────────────────────────────────────────────── */

function Hero() {
  return (
    <section id="top" style={{ paddingTop: 48, paddingBottom: 140, position: "relative" }}>
      <div className="wrap">
        <div className="hero-meta" style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 48 }}>
          <span className="mono hero-tagline">Scaling schools with a soul · Bloom Partners</span>
          <span className="mono" style={{ color: "var(--ink-3)" }}>Bloom Partners</span>

        <h1 style={{
          fontFamily: "var(--serif)",

          fontSize: "clamp(44px, 7.6vw, 116px)",
          lineHeight: 0.98,
          letterSpacing: "-0.025em",
          margin: 0,

        }}>

/* ─── Section 02: Why We Exist ─────────────────────────────────────────────── */

function WhyWeExist() {
  return (
    <section id="thesis" style={{ padding: "140px 0", background: "var(--paper-2)", borderTop: "1px solid var(--line-soft)", borderBottom: "1px solid var(--line-soft)" }}>
      <div className="wrap">
        <SectionLabel num="01" label="Our thesis" />
        <h2 style={{
          fontFamily: "var(--serif)", fontWeight: 400,
          fontSize: "clamp(36px, 4.4vw, 64px)", lineHeight: 1.05,
          letterSpacing: "-0.02em", margin: "32px 0 0", maxWidth: "20ch"
        }}>

        <div className="premise-grid" style={{ marginTop: 80, display: "grid", gridTemplateColumns: "1fr 2fr", gap: 80, alignItems: "start" }}>
          <div />
          <div style={{ display: "grid", gap: 24 }}>
            <p style={{ fontSize: 17, lineHeight: 1.65, margin: 0 }}>

            <p style={{ fontSize: 17, lineHeight: 1.65, margin: 0, color: "var(--ink-2)" }}>

  );
}

/* ─── Section 03: What We See ──────────────────────────────────────────────── */

const PATTERNS = [
  {
    n: "i.",
    title: "Founder dependency.",
    body: "Every decision flows through the founder. Nothing moves without your say. The school runs — but only because you never stop.",
  },
  {
    n: "ii.",
    title: "Growth feels like risk.",
    body: "A second campus, a franchise, a new centre. The ambition is there. But you don't know what breaks when you stretch.",
  },
  {
    n: "iii.",
    title: "You can't scale your founding team.",
    body: "Good people. Unclear roles. Systems that live in heads, not documents. The ceiling is structural, not personal.",
  },
];

function WhatWeSee() {
  return (
    <section id="patterns" style={{ padding: "140px 0" }}>
      <div className="wrap">
        <SectionLabel num="02" label="Patterns" />
        <h2 style={{
          fontFamily: "var(--serif)", fontWeight: 400,
          fontSize: "clamp(36px, 4.4vw, 64px)", lineHeight: 1.05,
          letterSpacing: "-0.02em", margin: "32px 0 0", maxWidth: "22ch"

                {p.n}

/* ─── Section 04: What We Bring ────────────────────────────────────────────── */

const PILLARS = [
  {
    n: "01",
    label: "Capital",
    title: "Organized for what the founder actually needs.",
    body: "Assembled from a network of operator-investors, regional family wealth, and diaspora capital looking for thoughtful India-edu deployment. Equity, debt, or blended — structured per-deal. Not a fund, not generic growth equity. Capital that understands preschools.",
    tags: ["Operator-investor syndicate", "Family-office partners", "Equity, debt, or blended", "Deal-by-deal SPVs"],

  if (kind === "model") {
    const yrs = ["Y0", "Y1", "Y2", "Y3", "Y4", "Y5"];
    const baseY = [172, 162, 152, 142, 134, 126];
    const projY = [172, 150, 122, 92, 64, 40];
    const xs = [44, 90, 136, 182, 228, 274];
    return (
      <svg viewBox="0 0 320 220" width="100%" style={{ display: "block" }}>
        <rect x="0" y="0" width="320" height="220" fill="var(--paper-2)" />
        <text x="14" y="16" fontFamily="var(--mono)" fontSize="7" fill="var(--ink-3)" letterSpacing="1.4">CAPITAL DEPLOYMENT · 5Y PROJECTION</text>
        <line x1="14" y1="22" x2="306" y2="22" stroke="var(--line)" strokeWidth="0.6" />
        {[40, 80, 120, 160].map((y, i) => (
          <g key={y}>
            <line x1="44" y1={y} x2="300" y2={y} stroke="var(--line)" strokeDasharray="1.5 3" strokeWidth="0.7" />
            <text x="40" y={y + 3} fontFamily="var(--mono)" fontSize="6.5" fill="var(--ink-3)" textAnchor="end" letterSpacing="0.5">{["₹8cr", "₹6cr", "₹4cr", "₹2cr"][i]}</text>

        <line x1="44" y1="186" x2="300" y2="186" stroke="var(--ink)" strokeWidth="1" />
        <line x1="44" y1="32" x2="44" y2="186" stroke="var(--ink)" strokeWidth="1" />
        {yrs.map((l, i) => (
          <text key={l} x={xs[i]} y="200" fontFamily="var(--mono)" fontSize="7" fill="var(--ink-3)" textAnchor="middle" letterSpacing="0.5">{l}</text>
        ))}
        <path
          d={`M ${xs[0]} ${baseY[0]} ${xs.map((x, i) => `L ${x} ${baseY[i]}`).join(" ")} ${xs.slice().reverse().map((x, i) => `L ${x} ${projY[xs.length - 1 - i]}`).join(" ")} Z`}

        />
        <path d={`M ${xs.map((x, i) => `${x} ${baseY[i]}`).join(" L ")}`.replace(/^/, "M ")} fill="none" stroke="var(--ink-3)" strokeWidth="1.2" strokeDasharray="3 3" />
        <path d={`M ${xs.map((x, i) => `${x} ${projY[i]}`).join(" L ")}`.replace(/^/, "M ")} fill="none" stroke="var(--accent)" strokeWidth="2.2" />
        {xs.map((x, i) => (
          <g key={i}>
            <circle cx={x} cy={projY[i]} r="3.2" fill="var(--paper-2)" stroke="var(--accent)" strokeWidth="1.6" />
            <circle cx={x} cy={baseY[i]} r="1.8" fill="var(--ink-3)" />
          </g>
        ))}
        <g transform="translate(168, 32)">
          <line x1="0" y1="0" x2="14" y2="0" stroke="var(--accent)" strokeWidth="2" />
          <text x="20" y="3" fontFamily="var(--mono)" fontSize="7" fill="var(--ink)" letterSpacing="0.6">WITH BLOOM · BACKED PATH</text>
        </g>
        <g transform="translate(168, 46)">

          <text x="20" y="3" fontFamily="var(--mono)" fontSize="7" fill="var(--ink-3)" letterSpacing="0.6">CURRENT TRAJECTORY</text>
        </g>
        <line x1="14" y1="208" x2="306" y2="208" stroke="var(--line)" strokeWidth="0.6" />

  if (kind === "ops") {
    const cols = [
      { x: 50, label: "ACADEMIC", under: ["Curriculum", "Assessment", "Teacher dev."] },
      { x: 130, label: "OPS", under: ["Admissions", "Compliance", "Facilities"] },

function ProgressBar({ step, total }) {
  const pct = total > 0 ? Math.round((step / total) * 100) : 0;
  const done = step;
  const left = total - step;
  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 8 }}>
        <span style={{ fontFamily: "var(--serif)", fontSize: 13, color: "var(--ink-3)" }}>
          <strong style={{ color: "var(--ink)", fontSize: 15 }}>{done}</strong> done &nbsp;·&nbsp; <strong style={{ color: "var(--ink)", fontSize: 15 }}>{left}</strong> left
        </span>
        <span className="mono" style={{ fontSize: 10, color: "var(--ink-3)" }}>{pct}%</span>
      </div>
      <div style={{ position: "relative", height: 6, background: "var(--line-soft)", borderRadius: 3, overflow: "hidden" }}>
        <div style={{
          position: "absolute", left: 0, top: 0, bottom: 0,
          width: `${pct}%`,
          background: "var(--accent)",
          borderRadius: 3,
          transition: "width 300ms ease",
        }} />
      </div>
    </div>
  );
}

function SliderInput({ q, value, setValue }) {
  const v = typeof value === "number" ? value : q.default;
  useEffect(() => {
    if (typeof value !== "number") setValue(q.default);
  }, []); // eslint-disable-line
  const unit = q.unit || "";
  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 18 }}>
        <span className="mono">{q.leftLabel}</span>
        <span style={{ fontFamily: "var(--serif)", fontSize: 56, lineHeight: 1, color: "var(--accent)" }}>
          {v}<span style={{ fontSize: 22, color: "var(--ink-3)" }}>{unit}</span>
        </span>
        <span className="mono">{q.rightLabel}</span>
      </div>
      <input
        type="range"
        min={q.min} max={q.max} step={q.step}
        value={v}
        onChange={e => setValue(Number(e.target.value))}
        style={{ width: "100%", accentColor: "var(--accent)" }}
      />
      <div style={{ display: "flex", justifyContent: "space-between", marginTop: 6 }}>
        {[q.min, Math.round((q.min + q.max) / 2), q.max].map(t => (
          <span key={t} className="mono" style={{ color: "var(--line)" }}>{t}{unit}</span>
        ))}
      </div>
    </div>
  );
}

const fieldStyle = {
  width: "100%", padding: "12px 0",

function NumberInput({ q, value, setValue }) {
  return (
    <div>
      <input
        type="number"
        min={q.min || 0}
        max={q.max}
        value={value === undefined || value === "" ? "" : value}
        onChange={e => {
          const raw = e.target.value;
          if (raw === "") { setValue(""); return; }
          const n = parseInt(raw, 10);
          if (!isNaN(n)) setValue(n);
        }}
        style={{ ...fieldStyle, width: 200, fontSize: 36, paddingBottom: 10 }}
        placeholder={q.placeholder || ""}
      />
      {q.max && <p className="mono" style={{ marginTop: 8, color: "var(--ink-3)" }}>Range: {q.min}–{q.max}</p>}
    </div>
  );
}

function TextInput({ q, value, setValue }) {
  const max = q.maxChars || 200;
  const current = (value || "").length;
  return (
    <div>
      <textarea
        value={value || ""}
        onChange={e => setValue(e.target.value.slice(0, max))}
        rows={4}
        style={{
          width: "100%", padding: "12px 0",
          border: "none", borderBottom: "1px solid var(--ink)",
          fontFamily: "var(--serif)", fontSize: 18, lineHeight: 1.5,

        placeholder={q.placeholder || ""}
      />

        <span className="mono" style={{ color: current > max * 0.85 ? "var(--accent)" : "var(--ink-3)" }}>

      </div>
    </div>
  );
}

        ].map(([a, b], i) => (
          <li key={i} style={{ display: "grid", gridTemplateColumns: "1fr 1.4fr", gap: 24, padding: "12px 0", borderTop: "1px solid var(--line-soft)" }}>
            <span style={{ fontFamily: "var(--serif)", fontSize: 16 }}>{a}</span>
            <span style={{ color: "var(--ink-3)", fontSize: 14 }}>{b}</span>
          </li>
        ))}
      </ul>
      <div>
        <button className="btn" onClick={onStart}>
          Begin the audit <span className="arrow">→</span>
        </button>
      </div>
    </div>
  );
}

function labelFor(qid, v) {
  const q = QUESTIONS.find(x => x.id === qid);
  if (!q || !q.options) return v || "—";
  const opt = q.options.find(o => o.v === v);
  return opt ? opt.label : (v || "—");
}

function Summary({ answers }) {
  const contact = answers.contact || {};
  const items = [
    ["School type",      labelFor("school_type", answers.school_type)],
    ["Units today",      answers.units ? `${answers.units}` : "—"],
    ["Students",         answers.students ? `${answers.students} enrolled` : "—"],
    ["Revenue / unit",   labelFor("revenue_per_unit", answers.revenue_per_unit)],
    ["Target scale",     answers.target_units ? `${answers.target_units} units` : "—"],
    ["Capital need",     labelFor("capital_need", answers.capital_need)],
    ["Open to capital",  labelFor("open_to_capital", answers.open_to_capital)],
  ];
  return (
    <div>
      {items.map(([k, v], i) => (
        <div key={i} style={{
          display: "grid", gridTemplateColumns: "1fr 1.4fr", gap: 16,
          padding: "14px 0",
          borderBottom: i < items.length - 1 ? "1px solid rgba(235,232,226,0.12)" : "none",
        }}>
          <span className="mono" style={{ color: "var(--paper-3)" }}>{k}</span>
          <span style={{ fontFamily: "var(--serif)", fontSize: 16, color: "var(--paper)" }}>{v || "—"}</span>
        </div>
      ))}
    </div>
  );
}

function AuditComplete({ answers, profileText, onRestart }) {
  const contact = answers.contact || {};
  const firstName = (contact.first_name || "you").split(" ")[0];

  return (
    <section id="audit" style={{ padding: "140px 0", background: "var(--surface-dark)", color: "var(--paper)" }}>
      <div className="wrap">
        <div style={{ display: "flex", alignItems: "baseline", gap: 14, marginBottom: 32 }}>
          <span className="mono" style={{ color: "var(--accent-2)" }}>readiness profile</span>
          <span style={{ flex: 1, height: 1, background: "rgba(235,232,226,0.3)" }} />
          <span className="mono" style={{ color: "var(--paper-3)" }}>{new Date().toLocaleDateString("en-IN", { day: "2-digit", month: "short", year: "numeric" })}</span>
        </div>

        <h2 style={{
          fontFamily: "var(--serif)", fontWeight: 400,
          fontSize: "clamp(40px, 5vw, 72px)", lineHeight: 1.05,
          letterSpacing: "-0.02em", margin: "0 0 48px",
        }}>
          Thank you, <em style={{ color: "var(--accent-2)" }}>{firstName}.</em>
        </h2>

        <div style={{ display: "grid", gridTemplateColumns: "1.2fr 1fr", gap: 80, alignItems: "start" }}>
          <div>
            {profileText ? (
              <div style={{
                fontFamily: "var(--serif)", fontSize: 18, lineHeight: 1.7,
                color: "var(--paper-2)",
                whiteSpace: "pre-wrap",
              }}>
                {profileText}
              </div>
            ) : (
              <div>
                <p style={{ color: "var(--paper-3)", fontSize: 18, lineHeight: 1.55, maxWidth: "44ch", margin: 0 }}>
                  We've received your audit and will be in touch within five business days if there's a fit.
                </p>
                <p style={{ color: "var(--paper-3)", fontSize: 16, lineHeight: 1.55, maxWidth: "44ch", marginTop: 16 }}>
                  If not, we'll let you know what to work on.
                </p>
              </div>
            )}

            <button onClick={onRestart} className="mono" style={{
              marginTop: 48, background: "none", border: "none",
              color: "var(--paper-3)", cursor: "pointer", padding: 0,
              borderBottom: "1px solid var(--paper-3)",
            }}>
              ← Edit my answers
            </button>
          </div>

          <div style={{ border: "1px solid rgba(235,232,226,0.2)", padding: 32 }}>
            <div className="mono" style={{ color: "var(--paper-3)", marginBottom: 20 }}>What you shared</div>
            <Summary answers={answers} />
          </div>
        </div>
      </div>
    </section>
  );
}

function Audit() {
  const [step, setStep]           = useState(-1);
  const [answers, setAnswers]     = useState({});
  const [submitted, setSubmitted] = useState(false);
  const [submitting, setSubmitting] = useState(false);
  const [profileText, setProfileText] = useState(null);

  // localStorage auto-save / restore
  useEffect(() => {
    try {
      const saved = localStorage.getItem("bloom-audit-v2");
      if (saved) {
        const { step: s, answers: a } = JSON.parse(saved);
        if (s >= 0) { setStep(s); setAnswers(a); }
      }
    } catch (e) {}
  }, []);

  useEffect(() => {
    if (step >= 0 || Object.keys(answers).length > 0) {
      try { localStorage.setItem("bloom-audit-v2", JSON.stringify({ step, answers })); } catch (e) {}
    }
  }, [step, answers]);

  const total = QUESTIONS.length;
  const q = step >= 0 && step < total ? QUESTIONS[step] : null;

  const setAnswer = (id, value) => setAnswers(prev => ({ ...prev, [id]: value }));

  const handleNext = async () => {
    if (step === total - 1) {
      setSubmitting(true);
      const contact = answers.contact || {};
      const formBody = new URLSearchParams({
        first_name:       contact.first_name || "",
        email:            contact.email || "",
        whatsapp:         contact.whatsapp || "",
        anything_else:    contact.anything_else || "",
        school_type:      answers.school_type || "",
        units:            String(answers.units ?? ""),
        students:         String(answers.students ?? ""),
        waitlist:         answers.waitlist || "",
        parent_word:      answers.parent_word || "",
        years_running:    answers.years_running || "",
        independence:     answers.independence || "",
        senior_leaders:   answers.senior_leaders || "",
        timeline:         String(answers.timeline ?? ""),
        revenue_per_unit: answers.revenue_per_unit || "",
        operating_margin: answers.operating_margin || "",
        utilization:      String(answers.utilization ?? ""),
        new_unit_capex:   answers.new_unit_capex || "",
        target_units:     String(answers.target_units ?? ""),
        capital_need:     answers.capital_need || "",
        scaling_unlocks:  answers.scaling_unlocks || "",
        codification:     answers.codification || "",
        open_to_capital:  answers.open_to_capital || "",
        why_now:          answers.why_now || "",
      }).toString();
      try {
        const res = await fetch("/.netlify/functions/submit-audit", {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: formBody,
        });
        const json = res.ok ? await res.json() : {};
        setProfileText(json.profile || null);
      } catch (e) {
        console.error("Submission error:", e);
        setProfileText(null);
      }
      try { localStorage.removeItem("bloom-audit-v2"); } catch (e) {}
      setSubmitting(false);
      setSubmitted(true);
    } else {
      setStep(s => s + 1);
    }
  };

  const canAdvance = useMemo(() => {
    if (!q) return true;
    const a = answers[q.id];
    if (q.type === "contact") return !!(a && a.first_name && a.first_name.trim() && a.email && /\S+@\S+\.\S+/.test(a.email));
    if (q.type === "slider")  return true;
    if (q.type === "number")  return a !== "" && a !== undefined && !isNaN(a) && Number(a) >= (q.min || 0);
    if (q.type === "text")    return !!(a && a.trim().length >= 10);
    if (q.type === "choice")  return !!a;
    return true;
  }, [q, answers]);

  if (submitted) {
    return <AuditComplete answers={answers} profileText={profileText} onRestart={() => { setAnswers({}); setStep(-1); setSubmitted(false); setProfileText(null); }} />;
  }

  return (
    <section id="audit" style={{ padding: "140px 0", background: "var(--paper-2)", borderTop: "1px solid var(--line-soft)" }}>
      <div className="wrap">
        <div className="audit-grid" style={{ display: "grid", gridTemplateColumns: "1fr 1.6fr", gap: 80, alignItems: "start" }}>

          {/* Left: description column */}
          <div className="audit-sticky" style={{ position: "sticky", top: 100 }}>
            <SectionLabel num="05" label="The audit" />
            <h2 style={{
              fontFamily: "var(--serif)", fontWeight: 400,
              fontSize: "clamp(32px, 3.6vw, 52px)", lineHeight: 1.07,
              letterSpacing: "-0.02em",
              margin: "32px 0 0",
            }}>
              Five minutes. <em style={{ color: "var(--accent)" }}>Honest answers.</em>
            </h2>
            <p style={{ marginTop: 20, color: "var(--ink-2)", fontSize: 16, lineHeight: 1.6, maxWidth: "36ch" }}>
              We use it to understand your school, your ambition, and whether there's a fit. You get a Readiness Profile in return — regardless of outcome.
            </p>

            <div style={{ marginTop: 48, borderTop: "1px solid var(--line)", paddingTop: 20 }}>
              {SECTION_ORDER.map((s, i) => {
                const sectionFirstIdx = QUESTIONS.findIndex(qq => qq.section === s);
                const sectionLastIdx = QUESTIONS.length - 1 - [...QUESTIONS].reverse().findIndex(qq => qq.section === s);
                const isActive = step >= sectionFirstIdx && step <= sectionLastIdx;
                const isPast = step > sectionLastIdx || submitted;
                return (
                  <div key={s} style={{
                    display: "grid", gridTemplateColumns: "28px 1fr auto",
                    padding: "10px 0",
                    borderBottom: i < SECTION_ORDER.length - 1 ? "1px solid var(--line-soft)" : "none",
                    color: isActive ? "var(--ink)" : "var(--ink-3)",
                  }}>
                    <span className="mono" style={{ color: isActive ? "var(--accent)" : undefined, fontSize: 10 }}>
                      {String(i + 1).padStart(2, "0")}
                    </span>
                    <span style={{ fontFamily: "var(--serif)", fontSize: 16, fontStyle: isActive ? "italic" : "normal" }}>{s}</span>
                    <span className="mono" style={{ fontSize: 10 }}>{isPast ? "✓" : isActive ? "···" : ""}</span>
                  </div>
                );
              })}
            </div>
          </div>

          {/* Right: audit card */}
          <div id="audit-card" style={{
            background: "var(--paper)",
            border: "1px solid var(--line)",
            minHeight: 560,
            display: "flex", flexDirection: "column",
          }}>
            <div className="audit-nav" style={{ padding: "16px 32px", borderBottom: "1px solid var(--line-soft)" }}>
              <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 10 }}>
                <span className="mono" style={{ fontSize: 10 }}>
                  {step < 0 ? "The audit" : q ? q.section : ""}
                </span>
                <span className="mono" style={{ fontSize: 10 }}>
                  {step < 0 ? `${total} questions` : `Q ${step + 1} / ${total}`}
                </span>
              </div>
              <ProgressBar step={Math.max(step, 0)} total={total} />
            </div>

            <div className="audit-inner" style={{ padding: "52px 52px 28px", flex: 1, display: "flex", flexDirection: "column" }}>
              {step < 0 && <AuditIntro onStart={() => setStep(0)} />}
              {q && (
                <QuestionView q={q} value={answers[q.id]} setValue={(v) => setAnswer(q.id, v)} />
              )}
            </div>

            {step >= 0 && (
              <div style={{
                padding: "20px 32px",
                borderTop: "1px solid var(--line-soft)",
                display: "flex", alignItems: "center", justifyContent: "space-between",
              }}>
                <button onClick={() => setStep(s => Math.max(-1, s - 1))} className="mono"
                  style={{ background: "none", border: "none", cursor: "pointer", color: "var(--ink-3)", padding: "8px 0", fontSize: 11 }}>
                  ← Back
                </button>
                <button className="btn" disabled={!canAdvance || submitting}
                  onClick={handleNext}
                  style={{ opacity: canAdvance && !submitting ? 1 : 0.35, cursor: canAdvance && !submitting ? "pointer" : "not-allowed", padding: "12px 22px" }}>
                  {step === total - 1 ? (submitting ? "Generating profile…" : "Submit audit") : "Continue"}
                  {!submitting && <span className="arrow">→</span>}
                </button>
              </div>
            )}
          </div>

        </div>
      </div>
    </section>
  );
}

/* ─── Footer ────────────────────────────────────────────────────────────────── */

function Footer() {
  return (
    <footer style={{ background: "var(--surface-dark)", color: "var(--paper)", padding: "96px 0 64px" }}>
      <div className="wrap">
        <p style={{
          fontFamily: "var(--serif)", fontWeight: 300,
          fontSize: "clamp(28px, 4vw, 56px)",
          lineHeight: 1.15, letterSpacing: "-0.02em",
          margin: 0, maxWidth: "22ch",
          color: "var(--paper)",
        }}>
          Building the next generation of India's best preschools — <em style={{ color: "var(--accent-2)", fontWeight: 400 }}>without compromise to soul.</em>
        </p>

        <div style={{ marginTop: 72, paddingTop: 32, borderTop: "1px solid rgba(235,232,226,0.15)" }}>
          <p className="mono" style={{ color: "var(--paper-3)", margin: 0 }}>
            Capital partners and referrals: through warm introductions only.
          </p>
        </div>
      </div>
    </footer>
  );
}

/* ─── App ───────────────────────────────────────────────────────────────────── */

function App() {
  useEffect(() => {
    const els = document.querySelectorAll("section, footer");
    const obs = new IntersectionObserver(
      entries => entries.forEach(e => {
        if (e.isIntersecting) { e.target.classList.add("visible"); obs.unobserve(e.target); }
      }),
      { threshold: 0.07, rootMargin: "0px 0px -40px 0px" }
    );
    els.forEach(el => { el.classList.add("fade-section"); obs.observe(el); });
    return () => obs.disconnect();
  }, []);

  return (
    <>
      <TopNav />
      <Hero />
      <WhyWeExist />
      <WhatWeSee />
      <WhatWeBring />
      <WhoWePartnerWith />
      <Audit />
      <Footer />
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

</body>
</html>
