<style>
  :root {
    --ink:        #1a1815;
    --ink-2:      #2c2924;
    --ink-3:      #4a463f;
    --paper:      #ebe8e2;
    --paper-2:    #e3dfd6;
    --paper-3:    #d8d3c7;
    --line:       #c2bcad;
    --line-soft:  #d3cfc6;
    --accent:        #8a3324;
    --accent-2:      #c25a3c;
    --surface-dark:  #1f2c3d;
    --serif: "Newsreader", "Iowan Old Style", "Charter", Georgia, serif;
    --sans:  "Inter Tight", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    --mono:  "JetBrains Mono", ui-monospace, Menlo, monospace;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  ::selection { background: var(--ink); color: var(--paper); }

  .mono { font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); }
  .serif { font-family: var(--serif); }
  .rule { height: 1px; background: var(--line); border: 0; margin: 0; }
  .rule-thick { height: 1px; background: var(--ink); border: 0; margin: 0; }

  .wrap { max-width: 1280px; margin: 0 auto; padding: 0 48px; }
  @media (max-width: 720px) { .wrap { padding: 0 24px; } }

  .btn {
    display: inline-flex; align-items: center; gap: 10px;
    font-family: var(--sans);
    font-size: 14px; font-weight: 500;
    letter-spacing: 0.01em;
    padding: 14px 22px;
    border: 1px solid var(--ink);
    background: var(--ink); color: var(--paper);
    cursor: pointer; text-decoration: none;
    transition: background 160ms ease, color 160ms ease, transform 160ms ease;
  }
  .btn:hover { background: var(--accent); border-color: var(--accent); }
  .btn-ghost { background: transparent; color: var(--ink); }
  .btn-ghost:hover { background: var(--ink); color: var(--paper); }
  .btn .arrow { transition: transform 160ms ease; }
  .btn:hover .arrow { transform: translateX(3px); }

  a { color: inherit; }

  .audit-card { scrollbar-width: thin; }

  html { scroll-behavior: smooth; }

  body::before {
    content: "";
    position: fixed; inset: 0;
    background-image: radial-gradient(rgba(26,24,21,0.025) 1px, transparent 1px);
    background-size: 3px 3px;
    pointer-events: none;
    z-index: 1;
    mix-blend-mode: multiply;
  }

  #root { position: relative; z-index: 2; }

  /* Scroll fade-in */
  .fade-section {
    opacity: 0;
    transform: translateY(28px);
    transition: opacity 0.65s ease, transform 0.65s ease;
  }
  .fade-section.visible {
    opacity: 1;
    transform: translateY(0);
  }

  /* Marquee */
  @keyframes marquee-scroll {
    from { transform: translateX(0); }
    to   { transform: translateX(-50%); }
  }
  .marquee-track {
    display: flex;
    white-space: nowrap;
    animation: marquee-scroll 32s linear infinite;
  }

  /* Pattern row hover */
  .pattern-row {
    transition: background 200ms ease, box-shadow 200ms ease;
  }
  .pattern-row:hover {
    background: var(--paper-2);
    box-shadow: 0 4px 24px rgba(26,24,21,0.07);
  }

  /* Responsive adjustments */
  @media (max-width: 900px) {
    .hero-grid { grid-template-columns: 1fr !important; gap: 48px !important; }
    .patterns-grid { grid-template-columns: 60px 1fr !important; }
    .pillar-grid { grid-template-columns: 1fr !important; }
    .criteria-grid { grid-template-columns: 1fr !important; }
    .audit-grid { grid-template-columns: 1fr !important; }
    .footer-grid { grid-template-columns: 1fr 1fr !important; }
    .complete-grid { grid-template-columns: 1fr !important; }
  }

  @media (max-width: 600px) {
    /* Nav: hide links, show only logo + CTA */
    .nav-links { display: none !important; }
    .nav-inner { padding: 14px 20px !important; }

    /* Tighten all section vertical padding */
    section { padding-top: 72px !important; padding-bottom: 72px !important; }
    footer  { padding-top: 72px !important; padding-bottom: 32px !important; }

    /* Hero meta strip: stack */
    .hero-meta { flex-direction: column !important; gap: 4px !important; margin-bottom: 28px !important; }

    /* Audit card inner */
    .audit-inner { padding: 32px 20px 20px !important; }
    .audit-nav   { padding: 14px 20px !important; }

    /* Criteria items: remove left padding/border on first */
    .criteria-item { padding: 32px 0 !important; border-left: none !important; padding-left: 0 !important; }

    /* Footer: single column */
    .footer-grid   { grid-template-columns: 1fr !important; gap: 28px !important; }
    .footer-bottom { flex-direction: column !important; gap: 6px !important; align-items: flex-start !important; }

    /* Pillar figures: reduce height on mobile */
    .pillar-figure { display: none !important; }

    /* Patterns: number + title row, body spans full width below */
    .pattern-row { grid-template-columns: 40px 1fr !important; gap: 8px 16px !important; }
    .patterns-body { grid-column: 1 / -1 !important; padding-top: 4px; }

    /* Hero: hide tagline on mobile, compress spacing so CTA is visible */
    .hero-tagline { display: none !important; }
    section#top { padding-top: 36px !important; padding-bottom: 64px !important; }
    .hero-meta { margin-bottom: 24px !important; }
    #hero-grid { margin-top: 40px !important; gap: 36px !important; }
    section#top h1 { font-size: 42px !important; }

    /* Premise: collapse empty left column */
    .premise-grid { grid-template-columns: 1fr !important; gap: 24px !important; }
    .premise-grid > div:first-child { display: none !important; }

    /* Audit: remove sticky so left col doesn't overlap right col */
    .audit-sticky { position: static !important; }
  }
</style>
</head>

<form name="bloom-audit" netlify netlify-honeypot="bot-field" hidden>

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>

<script type="text/babel">
const { useState, useEffect, useRef, useMemo, useCallback } = React;

/* ─── Design tokens ───────────────────────────────────────────────────────── */

/* ─── Shared atoms ────────────────────────────────────────────────────────── */

function SectionLabel({ num, label }) {
  return (
    <div style={{ display: "flex", alignItems: "baseline", gap: 14 }}>
      <span className="mono" style={{ color: "var(--accent)", fontWeight: 500 }}>{num}</span>
      <span style={{ flex: 1, height: 1, background: "var(--line)" }} />
      <span className="mono">{label}</span>
    </div>
  );
}

/* ─── Top nav ─────────────────────────────────────────────────────────────── */

function TopNav() {
  return (
    <nav style={{
      position: "sticky", top: 0, zIndex: 50,
      background: "rgba(235,232,226,0.85)",
      backdropFilter: "blur(8px)",
      WebkitBackdropFilter: "blur(8px)",
      borderBottom: "1px solid var(--line-soft)"
    }}>
      <div className="nav-inner" style={{
        display: "flex", alignItems: "center", justifyContent: "space-between",
        padding: "18px 48px"
      }}>
        <a href="#top" style={{ textDecoration: "none", display: "flex", alignItems: "center", gap: 10 }}>
          <span style={{
            width: 22, height: 22, border: "1.5px solid var(--accent)",
            borderRadius: 4, background: "var(--paper)",
            display: "inline-flex", alignItems: "center", justifyContent: "center",
            fontFamily: "var(--serif)", fontStyle: "normal", fontWeight: 700, fontSize: 15, lineHeight: 1,
            color: "var(--accent)"
          }}>B</span>
          <span style={{ fontFamily: "var(--serif)", fontSize: 17, letterSpacing: "-0.01em" }}>
            Bloom Partners
          </span>
        </a>
        <div className="nav-links" style={{ display: "flex", alignItems: "center", gap: 32 }}>
          <a href="#patterns" className="mono" style={{ textDecoration: "none" }}>Patterns</a>
          <a href="#work" className="mono" style={{ textDecoration: "none" }}>What we do</a>
          <a href="#fit" className="mono" style={{ textDecoration: "none" }}>Fit</a>
          <a href="#audit" className="btn" style={{ padding: "10px 18px", fontSize: 13 }}>
            Begin audit <span className="arrow">→</span>
          </a>
        </div>
      </div>
    </nav>
  );
}

/* ─── Hero ────────────────────────────────────────────────────────────────── */

function Hero() {
  return (
    <section id="top" style={{ paddingTop: 48, paddingBottom: 140, position: "relative" }}>
      <div className="wrap">
        <div className="hero-meta" style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 48 }}>
          <span className="mono hero-tagline">SCALING SCHOOLS WITH A SOUL</span>
          <span className="mono" style={{ color: "var(--ink-3)" }}>BLOOM PARTNERS</span>
        </div>

        <h1 style={{
          fontFamily: "var(--serif)",
          fontWeight: 400,
          fontSize: "clamp(44px, 7.6vw, 116px)",
          lineHeight: 0.98,
          letterSpacing: "-0.025em",
          margin: 0,
          maxWidth: "20ch",
        }}>
          Helping <span style={{ whiteSpace: "nowrap" }}>founder-led</span> schools <span style={{ color: "var(--accent)" }}>scale.</span>
        </h1>

        <div className="hero-grid" style={{
          marginTop: 72,
          display: "grid",
          gridTemplateColumns: "1.2fr 1fr",
          gap: 80,
          alignItems: "start"
        }} id="hero-grid">
          <p style={{ fontSize: 17, lineHeight: 1.6, color: "var(--ink-2)", margin: 0, maxWidth: "44ch" }}>
            We work with a handful of founder-led schools to scale them without losing what made them worth building.
          </p>

          <div style={{
            paddingLeft: 32,
            borderLeft: "1px solid var(--line)"
          }}>
            <div className="mono" style={{ color: "var(--accent)", marginBottom: 18 }}>How to begin</div>
            <p style={{ fontSize: 17, lineHeight: 1.6, color: "var(--ink-2)", margin: 0 }}>
              Take the audit. It takes five minutes. If what you read sounds like us — and you sound like the kind of school we work with — book a call at the end.
            </p>
            <a href="#audit-card" className="btn" style={{ marginTop: 28 }}>
              Begin the audit <span className="arrow">→</span>
            </a>
          </div>
        </div>
      </div>
    </section>
  );
}

/* ─── Premise ─────────────────────────────────────────────────────────────── */

function Premise() {
  return (
    <section id="premise" style={{ padding: "140px 0", background: "var(--paper-2)", borderTop: "1px solid var(--line-soft)", borderBottom: "1px solid var(--line-soft)" }}>
      <div className="wrap">
        <SectionLabel num="01" label="Our thesis, and why we exist" />
        <h2 style={{
          fontFamily: "var(--serif)", fontWeight: 400,
          fontSize: "clamp(36px, 4.4vw, 64px)", lineHeight: 1.05,
          letterSpacing: "-0.02em", margin: "32px 0 0", maxWidth: "22ch"
        }}>
          Scaling shouldn't come with a <em style={{ color: "var(--accent)" }}>compromise to quality.</em>
        </h2>

        <div className="premise-grid" style={{ marginTop: 80, display: "grid", gridTemplateColumns: "1fr 2fr", gap: 80, alignItems: "start" }}>
          <div />
          <div>
            <p style={{ fontSize: 17, lineHeight: 1.55, margin: 0 }}>
              Most schools dilute their impact the moment they add a second location.{" "}
              <span style={{ color: "var(--ink-3)" }}>We exist to prove that bigger can mean better</span>
              {" "}— and do so by providing the{" "}
              <em style={{ color: "var(--accent)" }}>hands-on operational rigour</em>
              {" "}required to scale without losing quality.
            </p>
          </div>
        </div>
      </div>
    </section>
  );
}

/* ─── Patterns ────────────────────────────────────────────────────────────── */

const PATTERNS = [
  {
    n: "i.",
    title: "Founder dependency",
    body: "Every decision flows through the founder. Nothing moves without your say. The school runs — but only because you never stop.",
  },
  {
    n: "ii.",
    title: "Growth feels like risk.",
    body: "A second location, a franchise, a new centre. The ambition is there. But you don't know what breaks when you stretch.",
  },
  {
    n: "iii.",
    title: "You can't scale your founding team.",
    body: "Good people. Unclear roles. Systems that live in heads, not documents. The ceiling is structural, not personal.",
  },
];

function Patterns() {
  return (
    <section id="patterns" style={{ padding: "140px 0" }}>
      <div className="wrap">
        <SectionLabel num="02" label="Patterns" />
        <h2 style={{
          fontFamily: "var(--serif)", fontWeight: 400,
          fontSize: "clamp(36px, 4.4vw, 64px)", lineHeight: 1.05,
          letterSpacing: "-0.02em", margin: "32px 0 0", maxWidth: "22ch"
        }}>
          What we see, <em style={{ color: "var(--accent)" }}>repeatedly.</em>
        </h2>
        <p style={{ marginTop: 24, color: "var(--ink-2)", maxWidth: "52ch", fontSize: 17, lineHeight: 1.55 }}>
          Three things show up across almost every founder-led school we talk to. Not failures. Just the structural cost of having grown a school by personal force of will.
        </p>
        <div style={{ marginTop: 80 }}>
          {PATTERNS.map((p, i) => (
            <article key={i} className="pattern-row" style={{
              display: "grid",
              gridTemplateColumns: "80px 1fr 1.6fr",

              gap: 48,
              alignItems: "start",
              padding: "44px 0",
              borderTop: "1px solid var(--line-soft)",
              borderBottom: i === PATTERNS.length - 1 ? "1px solid var(--line-soft)" : undefined
            }}>
              <div style={{
                fontFamily: "var(--serif)", fontStyle: "italic",
                fontSize: 28, color: "var(--accent)", lineHeight: 1
              }}>
                {p.n}
              </div>
              <h3 style={{
                fontFamily: "var(--serif)", fontWeight: 400,
                fontSize: "clamp(22px, 2vw, 30px)", lineHeight: 1.15,
                letterSpacing: "-0.01em", margin: 0, textWrap: "balance"
              }}>
                {p.title}
              </h3>
              <p className="patterns-body" style={{ fontSize: 16, lineHeight: 1.55, color: "var(--ink-2)", margin: 0, maxWidth: "52ch" }}>
                {p.body}
              </p>
            </article>
          ))}
        </div>
      </div>
    </section>
  );
}

/* ─── What we do ──────────────────────────────────────────────────────────── */

const PILLARS = [
  {
    n: "01",
    label: "Academic",
    title: "Codify the model that made you worth choosing.",
    body: "We work alongside your academic leaders to write down the pedagogy, the rituals, the day-in-the-life — what actually makes your school different. Not a brand book. A working playbook the next campus can teach from on day one.",
    tags: ["Pedagogical playbook", "Curriculum architecture", "Teacher training paths", "Quality bar across sites"],
    figure: "playbook"
  },
  {
    n: "02",
    label: "Operational",
    title: "Build the systems that run without you in the room.",
    body: "Admissions, admin, people, parent communications, the calendar. We map every recurring decision the school makes, then turn the ones that should be repeatable into SOPs that staff actually use. The school stops running on memory and starts running on structure.",
    tags: ["Org design", "SOPs in use", "Role clarity", "Internal champions"],
    figure: "ops"
  },
  {
    n: "03",
    label: "Business",
    title: "PE-grade modelling, and the tech that proves it.",
    body: "We clean the books, build projections, find the leakages, stress-test the unit economics, and choose the stack that gives you a live view across campuses. For the first time, you'll know exactly where you stand — and what scaling actually looks like, in numbers.",
    tags: ["Unit economics", "Scenario stress-tests", "Cash-flow projection", "Network dashboard"],
    figure: "model"
  },
];

function PillarFigure({ kind }) {
  if (kind === "model") {
    const yrs = ["Y0", "Y1", "Y2", "Y3", "Y4", "Y5"];
    const baseY = [172, 162, 152, 142, 134, 126];
    const projY = [172, 150, 122, 92, 64, 40];
    const xs = [44, 90, 136, 182, 228, 274];
    return (
      <svg viewBox="0 0 320 220" width="100%" style={{ display: "block" }}>
        <rect x="0" y="0" width="320" height="220" fill="var(--paper-2)" />
        <text x="14" y="16" fontFamily="var(--mono)" fontSize="7" fill="var(--ink-3)" letterSpacing="1.4">PE-GRADE PROJECTION · 5Y EBITDA</text>
        <line x1="14" y1="22" x2="306" y2="22" stroke="var(--line)" strokeWidth="0.6" />
        {[40, 80, 120, 160].map((y, i) => (
          <g key={y}>
            <line x1="44" y1={y} x2="300" y2={y} stroke="var(--line)" strokeDasharray="1.5 3" strokeWidth="0.7" />
            <text x="40" y={y + 3} fontFamily="var(--mono)" fontSize="6.5" fill="var(--ink-3)" textAnchor="end" letterSpacing="0.5">{["£8M", "£6M", "£4M", "£2M"][i]}</text>
          </g>
        ))}
        <line x1="44" y1="186" x2="300" y2="186" stroke="var(--ink)" strokeWidth="1" />
        <line x1="44" y1="32" x2="44" y2="186" stroke="var(--ink)" strokeWidth="1" />
        {yrs.map((l, i) => (
          <text key={l} x={xs[i]} y="200" fontFamily="var(--mono)" fontSize="7" fill="var(--ink-3)" textAnchor="middle" letterSpacing="0.5">{l}</text>
        ))}
        <path
          d={`M ${xs[0]} ${baseY[0]} ${xs.map((x, i) => `L ${x} ${baseY[i]}`).join(" ")} ${xs.slice().reverse().map((x, i) => `L ${x} ${projY[xs.length - 1 - i]}`).join(" ")} Z`}
          fill="var(--accent-2)" fillOpacity="0.12"
        />
        <path d={`M ${xs.map((x, i) => `${x} ${baseY[i]}`).join(" L ")}`.replace(/^/, "M ")} fill="none" stroke="var(--ink-3)" strokeWidth="1.2" strokeDasharray="3 3" />
        <path d={`M ${xs.map((x, i) => `${x} ${projY[i]}`).join(" L ")}`.replace(/^/, "M ")} fill="none" stroke="var(--accent)" strokeWidth="2.2" />
        {xs.map((x, i) => (
          <g key={i}>
            <circle cx={x} cy={projY[i]} r="3.2" fill="var(--paper-2)" stroke="var(--accent)" strokeWidth="1.6" />
            <circle cx={x} cy={baseY[i]} r="1.8" fill="var(--ink-3)" />
          </g>
        ))}
        <line x1={xs[5] + 4} y1={projY[5]} x2={xs[5] + 14} y2={projY[5]} stroke="var(--accent)" strokeWidth="1" />
        <g transform="translate(168, 32)">
          <line x1="0" y1="0" x2="14" y2="0" stroke="var(--accent)" strokeWidth="2" />
          <text x="20" y="3" fontFamily="var(--mono)" fontSize="7" fill="var(--ink)" letterSpacing="0.6">PROJECTED · POST-AUDIT</text>
        </g>
        <g transform="translate(168, 46)">
          <line x1="0" y1="0" x2="14" y2="0" stroke="var(--ink-3)" strokeWidth="1.2" strokeDasharray="3 3" />
          <text x="20" y="3" fontFamily="var(--mono)" fontSize="7" fill="var(--ink-3)" letterSpacing="0.6">CURRENT TRAJECTORY</text>
        </g>
        <line x1="14" y1="208" x2="306" y2="208" stroke="var(--line)" strokeWidth="0.6" />
      </svg>
    );
  }

  if (kind === "ops") {
    const cols = [
      { x: 50, label: "ACADEMIC", under: ["Curriculum", "Assessment", "Teacher dev."] },
      { x: 130, label: "OPS", under: ["Admissions", "Compliance", "Facilities"] },
      { x: 210, label: "PEOPLE", under: ["Hiring", "Reviews", "Comp & ladders"] },
    ];
    return (
      <svg viewBox="0 0 320 220" width="100%" style={{ display: "block" }}>
        <rect x="0" y="0" width="320" height="220" fill="var(--paper-2)" />
        <text x="14" y="16" fontFamily="var(--mono)" fontSize="7" fill="var(--ink-3)" letterSpacing="1.4">OPERATING MODEL · CODIFIED</text>
        <line x1="14" y1="22" x2="306" y2="22" stroke="var(--line)" strokeWidth="0.6" />
        <g>
          <rect x="125" y="34" width="70" height="26" fill="var(--accent)" />
          <text x="160" y="51" fontFamily="var(--mono)" fontSize="8" fill="var(--paper)" letterSpacing="1.2" textAnchor="middle">FOUNDER</text>
        </g>
        <g stroke="var(--ink)" strokeWidth="1" fill="none">
          <line x1="160" y1="60" x2="160" y2="76" />
          <line x1="80" y1="76" x2="240" y2="76" />
          <line x1="80" y1="76" x2="80" y2="92" />
          <line x1="160" y1="76" x2="160" y2="92" />
          <line x1="240" y1="76" x2="240" y2="92" />
        </g>
        {cols.map((c, i) => (
          <g key={i}>
            <rect x={c.x} y="92" width="60" height="24" fill="var(--paper)" stroke="var(--ink)" />
            <text x={c.x + 30} y="108" fontFamily="var(--mono)" fontSize="7" fill="var(--ink)" letterSpacing="1" textAnchor="middle">{c.label}</text>
          </g>

function ProgressBar({ step, total }) {
  return (
    <div style={{ display: "flex", gap: 6, alignItems: "center" }}>

        }} />
      ))}
    </div>
  );
}

function SliderInput({ q, value, setValue }) {
  const v = typeof value === "number" ? value : q.default;
  useEffect(() => {
    if (typeof value !== "number") setValue(q.default);
  }, []); // eslint-disable-line
  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 18 }}>
        <span className="mono">{q.leftLabel}</span>
        <span style={{ fontFamily: "var(--serif)", fontSize: 56, lineHeight: 1, color: "var(--accent)" }}>
          {v}<span style={{ fontSize: 22, color: "var(--ink-3)" }}>%</span>
        </span>
        <span className="mono">{q.rightLabel}</span>
      </div>
      <input
        type="range"
        min={q.min} max={q.max} step={q.step}
        value={v}
        onChange={e => setValue(Number(e.target.value))}
        style={{ width: "100%", accentColor: "var(--accent)" }}
      />
      <div style={{ display: "flex", justifyContent: "space-between", marginTop: 6 }}>
        {[0, 25, 50, 75, 100].map(t => (
          <span key={t} className="mono" style={{ color: "var(--line)" }}>{t}</span>
        ))}
      </div>
    </div>
  );
}

function labelFor(qid, v) {
  const q = QUESTIONS.find(x => x.id === qid);
  if (!q || !q.options) return v || "—";
  const opt = q.options.find(o => o.v === v);
  return opt ? opt.label : "—";
}

              fontFamily: "var(--serif)", fontWeight: 400,

              We read every audit ourselves. You'll hear from us within 48 hours — typically with a written read-back of what we noticed, and a call link if we think there's a fit.
            </p>

            <div style={{ marginTop: 56, paddingTop: 32, borderTop: "1px solid rgba(235,232,226,0.15)" }}>
              <div className="mono" style={{ color: "var(--paper-3)", marginBottom: 14 }}>If you'd rather not wait</div>
              <a href="mailto:hellobloompartners@gmail.com" className="btn" style={{
                background: "var(--accent-2)", borderColor: "var(--accent-2)", color: "var(--ink)",
              }}>
                Book a 30-minute call <span className="arrow">→</span>

            <button onClick={onRestart} className="mono" style={{
              marginTop: 40, background: "none", border: "none",

            }}>

          <div style={{ border: "1px solid rgba(235,232,226,0.2)", padding: 32 }}>

            <Summary answers={answers} />

      </div>
    </section>
  );
}

function Audit() {
  const [step, setStep] = useState(-1);
  const [answers, setAnswers] = useState({});
  const [submitted, setSubmitted] = useState(false);
  const [submitting, setSubmitting] = useState(false);

  const total = QUESTIONS.length;
  const q = step >= 0 && step < total ? QUESTIONS[step] : null;

  const setAnswer = (id, value) => setAnswers(prev => ({ ...prev, [id]: value }));

  const handleNext = async () => {
    if (step === total - 1) {
      setSubmitting(true);
      const contact = answers.contact || {};
      try {
        await fetch("/", {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: new URLSearchParams({
            "form-name": "bloom-audit",
            name: contact.name || "",
            email: contact.email || "",
            school: contact.school || "",
            location: contact.location || "",
            stage: answers.stage || "",
            founder_load: answers.founder_load || "",
            philosophy: answers.philosophy || "",
            leaders: answers.leaders || "",
            codified: String(answers.codified ?? ""),
            ambition: answers.ambition || "",
            started: Array.isArray(answers.started) ? answers.started.join(", ") : "",
            constraint: answers.constraint || "",
            context: answers.context || "",
          }).toString(),
        });
      } catch (e) {
        console.error("Submission error:", e);
      }
      setSubmitting(false);
      setSubmitted(true);
    } else {
      setStep(s => s + 1);
    }
  };

  const canAdvance = useMemo(() => {
    if (!q) return true;
    const a = answers[q.id];
    if (q.type === "contact") return a && a.name && a.email && /\S+@\S+\.\S+/.test(a.email);
    if (q.type === "slider") return true;
    if (q.type === "textarea") return true;
    if (q.type === "multi") return Array.isArray(a) && a.length > 0;
    if (q.type === "text") return a && a.trim().length > 2;
    if (q.type === "choice") return !!a;
    return true;
  }, [q, answers]);

  if (submitted) {
    return <AuditComplete answers={answers} onRestart={() => { setAnswers({}); setStep(-1); setSubmitted(false); }} />;
  }

  return (
    <section id="audit" style={{ padding: "140px 0", background: "var(--paper-2)", borderTop: "1px solid var(--line-soft)" }}>
      <div className="wrap">
        <div className="audit-grid" style={{
          display: "grid",
          gridTemplateColumns: "1fr 1.6fr",
          gap: 80,
          alignItems: "start",
        }}>
          {/* Left: index column */}
          <div className="audit-sticky" style={{ position: "sticky", top: 100 }}>
            <SectionLabel num="05" label="The audit" />
            <h2 style={{
              fontFamily: "var(--serif)", fontWeight: 400,
              fontSize: "clamp(36px, 4vw, 56px)", lineHeight: 1.05,
              letterSpacing: "-0.02em",
              margin: "32px 0 0",
              textWrap: "balance",
            }}>
              Five minutes. <em style={{ color: "var(--accent)" }}>Honest answers.</em>
            </h2>
            <p style={{ marginTop: 20, color: "var(--ink-2)", fontSize: 16, lineHeight: 1.6, maxWidth: "36ch" }}>
              Take the audit. It helps you understand us, and us understand you. If you like what you see at the end, book a call.
            </p>

            <div style={{ marginTop: 56, borderTop: "1px solid var(--line)", paddingTop: 20 }}>
              {SECTION_ORDER.map((s, i) => {
                const sectionFirstIdx = QUESTIONS.findIndex(qq => qq.section === s);
                const sectionLastIdx = QUESTIONS.length - 1 - [...QUESTIONS].reverse().findIndex(qq => qq.section === s);
                const isActive = step >= sectionFirstIdx && step <= sectionLastIdx;
                const isPast = step > sectionLastIdx || submitted;
                return (
                  <div key={s} style={{
                    display: "grid", gridTemplateColumns: "32px 1fr auto",
                    padding: "12px 0",
                    borderBottom: i < SECTION_ORDER.length - 1 ? "1px solid var(--line-soft)" : "none",
                    color: isActive ? "var(--ink)" : "var(--ink-3)",
                  }}>
                    <span className="mono" style={{ color: isActive ? "var(--accent)" : undefined }}>
                      {String(i + 1).padStart(2, "0")}
                    </span>
                    <span style={{
                      fontFamily: "var(--serif)", fontSize: 18,
                      fontStyle: isActive ? "italic" : "normal",
                    }}>{s}</span>
                    <span className="mono">{isPast ? "✓" : isActive ? "···" : ""}</span>
                  </div>
                );
              })}
            </div>
          </div>

          {/* Right: card */}
          <div id="audit-card" className="audit-card" style={{
            background: "var(--paper)",
            border: "1px solid var(--line)",
            minHeight: 560,
            display: "flex", flexDirection: "column",
          }}>
            <div className="audit-nav" style={{
              padding: "20px 32px",
              borderBottom: "1px solid var(--line-soft)",
              display: "flex", alignItems: "center", justifyContent: "space-between",
              gap: 24,
            }}>
              <span className="mono">
                {step < 0 ? `Audit · 00 / ${String(total).padStart(2, "0")}` :
                  q ? `${q.section} · ${String(step + 1).padStart(2, "0")} / ${String(total).padStart(2, "0")}` : ""}
              </span>
              <div style={{ flex: 1, maxWidth: 220 }}>
                <ProgressBar step={Math.max(step, 0)} total={total} />
              </div>
            </div>

            <div className="audit-inner" style={{ padding: "56px 56px 32px", flex: 1, display: "flex", flexDirection: "column" }}>
              {step < 0 && <AuditIntro onStart={() => setStep(0)} />}
              {q && (
                <QuestionView q={q} value={answers[q.id]} setValue={(v) => setAnswer(q.id, v)} />
              )}
            </div>

            {step >= 0 && (
              <div style={{
                padding: "20px 32px",
                borderTop: "1px solid var(--line-soft)",
                display: "flex", alignItems: "center", justifyContent: "space-between",
              }}>
                <button onClick={() => setStep(s => Math.max(-1, s - 1))} className="mono"
                  style={{ background: "none", border: "none", cursor: "pointer", color: "var(--ink-3)", padding: "8px 0" }}>
                  ← Back
                </button>
                <button className="btn" disabled={!canAdvance || submitting}
                  onClick={handleNext}
                  style={{ opacity: canAdvance && !submitting ? 1 : 0.35, cursor: canAdvance && !submitting ? "pointer" : "not-allowed", padding: "12px 22px" }}>
                  {step === total - 1 ? (submitting ? "Sending…" : "Submit audit") : "Continue"}
                  {!submitting && <span className="arrow">→</span>}
                </button>
              </div>
            )}
          </div>
        </div>
      </div>
    </section>
  );
}

        <div className="footer-grid" style={{
          marginTop: 96,

          gap: 48,
          paddingTop: 40,
          borderTop: "1px solid rgba(235,232,226,0.2)"
        }}>
          <div>
            <div className="mono" style={{ color: "var(--paper-3)", marginBottom: 14 }}>Contact</div>
            <a href="mailto:hellobloompartners@gmail.com" style={{ fontFamily: "var(--serif)", fontSize: 18, textDecoration: "none" }}>
              hellobloompartners@gmail.com
            </a>
          </div>
          <div>
            <div className="mono" style={{ color: "var(--paper-3)", marginBottom: 14 }}>Engagements</div>
            <div style={{ fontFamily: "var(--serif)", fontSize: 18 }}>A handful, each year</div>
          </div>
          <div>
            <div className="mono" style={{ color: "var(--paper-3)", marginBottom: 14 }}>Currently</div>
            <div style={{ fontFamily: "var(--serif)", fontSize: 18 }}>Open to first audits</div>
          </div>
          <div>
            <div className="mono" style={{ color: "var(--paper-3)", marginBottom: 14 }}>Begin</div>
            <a href="#audit" style={{
              fontFamily: "var(--serif)", fontSize: 18,

              textDecorationColor: "var(--accent-2)"

        <div className="footer-bottom" style={{

          color: "var(--paper-3)"
        }}>
          <span className="mono">© 2025 Bloom Partners — All rights reserved</span>
          <span className="mono">Based in Bangalore</span>
        </div>
      </div>
    </footer>
  );
}

/* ─── App root ────────────────────────────────────────────────────────────── */

function App() {
  useEffect(() => {
    const els = document.querySelectorAll('section, footer');
    const obs = new IntersectionObserver(
      entries => entries.forEach(e => {
        if (e.isIntersecting) { e.target.classList.add('visible'); obs.unobserve(e.target); }
      }),
      { threshold: 0.07, rootMargin: "0px 0px -40px 0px" }
    );
    els.forEach(el => { el.classList.add('fade-section'); obs.observe(el); });
    return () => obs.disconnect();
  }, []);

  return (
    <>
      <TopNav />
      <Hero />
      <Premise />
      <Patterns />
      <WhatWeDo />
      <WhatWeLookFor />
      <Audit />
      <Footer />
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
