<style>
  :root {
    --ink:        #1a1815;
    --ink-2:      #2c2924;
    --ink-3:      #4a463f;
    --paper:      #ebe8e2;
    --paper-2:    #e3dfd6;
    --paper-3:    #d8d3c7;
    --line:       #c2bcad;
    --line-soft:  #d3cfc6;
    --accent:        #8a3324;
    --accent-2:      #c25a3c;
    --surface-dark:  #1f2c3d;
    --serif: "Newsreader", "Iowan Old Style", "Charter", Georgia, serif;
    --sans:  "Inter Tight", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    --mono:  "JetBrains Mono", ui-monospace, Menlo, monospace;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  ::selection { background: var(--ink); color: var(--paper); }

  .mono { font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); }
  .serif { font-family: var(--serif); }
  .rule { height: 1px; background: var(--line); border: 0; margin: 0; }
  .rule-thick { height: 1px; background: var(--ink); border: 0; margin: 0; }

  .wrap { max-width: 1280px; margin: 0 auto; padding: 0 48px; }
  @media (max-width: 720px) { .wrap { padding: 0 24px; } }

  .btn {
    display: inline-flex; align-items: center; gap: 10px;
    font-family: var(--sans);
    font-size: 14px; font-weight: 500;
    letter-spacing: 0.01em;
    padding: 14px 22px;
    border: 1px solid var(--ink);
    background: var(--ink); color: var(--paper);
    cursor: pointer; text-decoration: none;
    transition: background 160ms ease, color 160ms ease, transform 160ms ease;
  }
  .btn:hover { background: var(--accent); border-color: var(--accent); }
  .btn-ghost { background: transparent; color: var(--ink); }
  .btn-ghost:hover { background: var(--ink); color: var(--paper); }
  .btn .arrow { transition: transform 160ms ease; }
  .btn:hover .arrow { transform: translateX(3px); }

  a { color: inherit; }

  .audit-card { scrollbar-width: thin; }

  html { scroll-behavior: smooth; }

  body::before {
    content: "";
    position: fixed; inset: 0;
    background-image: radial-gradient(rgba(26,24,21,0.025) 1px, transparent 1px);
    background-size: 3px 3px;
    pointer-events: none;
    z-index: 1;
    mix-blend-mode: multiply;
  }

  #root { position: relative; z-index: 2; }

  /* Scroll fade-in */
  .fade-section {
    opacity: 0;
    transform: translateY(28px);
    transition: opacity 0.65s ease, transform 0.65s ease;
  }
  .fade-section.visible {
    opacity: 1;
    transform: translateY(0);
  }

  /* Marquee */
  @keyframes marquee-scroll {
    from { transform: translateX(0); }
    to   { transform: translateX(-50%); }
  }
  .marquee-track {
    display: flex;
    white-space: nowrap;
    animation: marquee-scroll 32s linear infinite;
  }

  /* Pattern row hover */
  .pattern-row {
    transition: background 200ms ease, box-shadow 200ms ease;
  }
  .pattern-row:hover {
    background: var(--paper-2);
    box-shadow: 0 4px 24px rgba(26,24,21,0.07);
  }

  /* Responsive adjustments */
  @media (max-width: 900px) {
    .hero-grid { grid-template-columns: 1fr !important; gap: 48px !important; }
    .patterns-grid { grid-template-columns: 60px 1fr !important; }
    .pillar-grid { grid-template-columns: 1fr !important; }
    .criteria-grid { grid-template-columns: 1fr !important; }
    .audit-grid { grid-template-columns: 1fr !important; }
    .footer-grid { grid-template-columns: 1fr 1fr !important; }
    .complete-grid { grid-template-columns: 1fr !important; }
  }

  @media (max-width: 600px) {
    /* Nav: hide links, show only logo + CTA */
    .nav-links { display: none !important; }
    .nav-inner { padding: 14px 20px !important; }

    /* Tighten all section vertical padding */
    section { padding-top: 72px !important; padding-bottom: 72px !important; }
    footer  { padding-top: 72px !important; padding-bottom: 32px !important; }

    /* Hero meta strip: stack */
    .hero-meta { flex-direction: column !important; gap: 4px !important; margin-bottom: 28px !important; }

    /* Audit card inner */
    .audit-inner { padding: 32px 20px 20px !important; }
    .audit-nav   { padding: 14px 20px !important; }

    /* Criteria items: remove left padding/border on first */
    .criteria-item { padding: 32px 0 !important; border-left: none !important; padding-left: 0 !important; }

    /* Footer: single column */
    .footer-grid   { grid-template-columns: 1fr !important; gap: 28px !important; }
    .footer-bottom { flex-direction: column !important; gap: 6px !important; align-items: flex-start !important; }

    /* Pillar figures: reduce height on mobile */
    .pillar-figure { display: none !important; }

    /* Patterns: number + title row, body spans full width below */
    .pattern-row { grid-template-columns: 40px 1fr !important; gap: 8px 16px !important; }
    .patterns-body { grid-column: 1 / -1 !important; padding-top: 4px; }

    /* Hero: hide tagline on mobile, compress spacing so CTA is visible */
    .hero-tagline { display: none !important; }
    section#top { padding-top: 36px !important; padding-bottom: 64px !important; }
    .hero-meta { margin-bottom: 24px !important; }
    #hero-grid { margin-top: 40px !important; gap: 36px !important; }
    section#top h1 { font-size: 42px !important; }

    /* Premise: collapse empty left column */
    .premise-grid { grid-template-columns: 1fr !important; gap: 24px !important; }
    .premise-grid > div:first-child { display: none !important; }

    /* Audit: remove sticky so left col doesn't overlap right col */
    .audit-sticky { position: static !important; }
  }
</style>

function ProgressBar({ step, total }) {
  const pct = total > 0 ? Math.round((step / total) * 100) : 0;
  const done = step;
  const left = total - step;
  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 8 }}>
        <span style={{ fontFamily: "var(--serif)", fontSize: 13, color: "var(--ink-3)" }}>
          <strong style={{ color: "var(--ink)", fontSize: 15 }}>{done}</strong> done &nbsp;·&nbsp; <strong style={{ color: "var(--ink)", fontSize: 15 }}>{left}</strong> left
        </span>
        <span className="mono" style={{ fontSize: 10, color: "var(--ink-3)" }}>{pct}%</span>
      </div>
      <div style={{ position: "relative", height: 6, background: "var(--line-soft)", borderRadius: 3, overflow: "hidden" }}>
        <div style={{
          position: "absolute", left: 0, top: 0, bottom: 0,
          width: `${pct}%`,
          background: "var(--accent)",
          borderRadius: 3,
          transition: "width 300ms ease",
        }} />
      </div>
    </div>
  );
}

                  background: selected ? "var(--paper-2)" : "transparent",
                  cursor: "pointer",
                  transition: "all 120ms ease",
                }}>
                  <input type="radio" name={q.id} value={opt.v} checked={selected}
                    onChange={() => setValue(opt.v)} style={{ display: "none" }} />
                  <span style={{
                    width: 14, height: 14, borderRadius: "50%",
                    border: "1px solid var(--ink)",
                    background: selected ? "var(--ink)" : "transparent",
                    flexShrink: 0,
                  }} />
                  <span style={{ fontSize: 16, fontFamily: "var(--serif)" }}>{opt.label}</span>
                </label>
              );
            })}
          </div>
        )}

        {q.type === "multi" && (
          <div style={{ display: "grid", gap: 8 }}>
            {q.options.map(opt => {
              const arr = Array.isArray(value) ? value : [];
              const selected = arr.includes(opt);
              return (
                <label key={opt} style={{
                  display: "flex", alignItems: "center", gap: 14,
                  padding: "14px 16px",
                  border: `1px solid ${selected ? "var(--ink)" : "var(--line)"}`,
                  background: selected ? "var(--paper-2)" : "transparent",
                  cursor: "pointer",
                }}>
                  <input type="checkbox" checked={selected} onChange={() => {
                    if (selected) setValue(arr.filter(x => x !== opt));
                    else setValue([...arr, opt]);
                  }} style={{ display: "none" }} />
                  <span style={{
                    width: 14, height: 14, border: "1px solid var(--ink)",
                    background: selected ? "var(--ink)" : "transparent",
                    flexShrink: 0,
                    display: "inline-flex", alignItems: "center", justifyContent: "center",
                    color: "var(--paper)", fontSize: 10,
                  }}>{selected ? "✓" : ""}</span>
                  <span style={{ fontSize: 15 }}>{opt}</span>
                </label>
              );
            })}
          </div>
        )}

        {q.type === "text" && (
          <input type="text" value={value || ""} onChange={e => setValue(e.target.value)}
            placeholder={q.placeholder} style={{
              width: "100%", padding: "16px 0",
              border: "none", borderBottom: "1px solid var(--ink)",
              fontFamily: "var(--serif)", fontSize: 22,
              background: "transparent", outline: "none", color: "var(--ink)",
            }} />
        )}

        {q.type === "textarea" && (
          <textarea value={value || ""} onChange={e => setValue(e.target.value)}
            placeholder={q.placeholder} rows={5} style={{
              width: "100%", padding: 16,
              border: "1px solid var(--line)",
              fontFamily: "var(--serif)", fontSize: 17, lineHeight: 1.5,
              background: "var(--paper-2)", outline: "none", color: "var(--ink)",
              resize: "vertical",
            }} />
        )}

        {q.type === "slider" && <SliderInput q={q} value={value} setValue={setValue} />}
        {q.type === "contact" && <ContactForm value={value || {}} setValue={setValue} />}
      </div>
    </div>
  );
}

function AuditIntro({ onStart }) {
  return (
    <div style={{ flex: 1, display: "flex", flexDirection: "column", justifyContent: "center", maxWidth: "44ch" }}>
      <div className="mono" style={{ color: "var(--accent)", marginBottom: 24 }}>Begin</div>
      <h3 style={{
        fontFamily: "var(--serif)", fontWeight: 400,
        fontSize: 36, lineHeight: 1.15, letterSpacing: "-0.015em",
        margin: 0, textWrap: "balance",
      }}>
        A short, honest audit. Around 18 questions across four parts. We use it to assess fit on capital, operations, and ambition.
      </h3>
      <p style={{ marginTop: 20, fontSize: 16, color: "var(--ink-2)", lineHeight: 1.65 }}>
        Built for founders who are ready to scale — not explore. We use this to assess fit on capital, operations, and ambition, so our first conversation is substantive, not introductory.
      </p>
      <ul style={{ margin: "32px 0 40px", padding: 0, listStyle: "none" }}>
        {[
          ["Five minutes.", "Most finish in three."],
          ["Honest > polished.", "We read everything."],
          ["No wrong answers.", "Only an honest one."],
        ].map(([a, b], i) => (
          <li key={i} style={{ display: "grid", gridTemplateColumns: "1fr 1.4fr", gap: 24, padding: "12px 0", borderTop: "1px solid var(--line-soft)" }}>
            <span style={{ fontFamily: "var(--serif)", fontSize: 16 }}>{a}</span>
            <span style={{ color: "var(--ink-3)", fontSize: 14 }}>{b}</span>
          </li>
        ))}
      </ul>
      <div>
        <button className="btn" onClick={onStart}>
          Start the audit <span className="arrow">→</span>
        </button>
      </div>
    </div>
  );
}

function labelFor(qid, v) {
  const q = QUESTIONS.find(x => x.id === qid);
  if (!q || !q.options) return v || "—";
  const opt = q.options.find(o => o.v === v);
  return opt ? opt.label : "—";
}

function Summary({ answers }) {
  const items = [
    ["School type", labelFor("school_type", answers.school_type)],
    ["Centres", labelFor("centres", answers.centres)],
    ["Enrolment trend", labelFor("enrollment_trend", answers.enrollment_trend)],
    ["Scale vision", labelFor("scale_vision", answers.scale_vision)],
    ["Biggest obstacle", labelFor("obstacle", answers.obstacle)],
    ["Finance clarity", typeof answers.finance_clarity === "number" ? `${answers.finance_clarity} / 5` : "—"],
    ["Systems codified", typeof answers.systems_codified === "number" ? `${answers.systems_codified} / 5` : "—"],
  ];
  return (
    <div>
      {items.map(([k, v], i) => (
        <div key={i} style={{
          display: "grid", gridTemplateColumns: "1fr 1.4fr", gap: 16,
          padding: "14px 0",
          borderBottom: i < items.length - 1 ? "1px solid rgba(235,232,226,0.12)" : "none",
        }}>
          <span className="mono" style={{ color: "var(--paper-3)" }}>{k}</span>
          <span style={{ fontFamily: "var(--serif)", fontSize: 16, color: "var(--paper)" }}>{v || "—"}</span>
        </div>
      ))}
    </div>
  );
}

  return (

      <div className="wrap">
        <div className="complete-grid" style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 80, alignItems: "start" }}>
          <div>
            <div style={{ display: "flex", alignItems: "baseline", gap: 14, marginBottom: 32 }}>
              <span className="mono" style={{ color: "var(--accent-2)" }}>received</span>
              <span style={{ flex: 1, height: 1, background: "rgba(235,232,226,0.3)" }} />
              <span className="mono" style={{ color: "var(--paper-3)" }}>{new Date().toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" })}</span>
            </div>
            <h2 style={{
              fontFamily: "var(--serif)", fontWeight: 400,
              fontSize: "clamp(40px, 5vw, 72px)", lineHeight: 1.05,
              letterSpacing: "-0.02em", margin: 0, textWrap: "balance",
            }}>
              Thank you, <em style={{ color: "var(--accent-2)" }}>{firstName}.</em>
            </h2>
            <p style={{ marginTop: 28, color: "var(--paper-3)", fontSize: 18, lineHeight: 1.55, maxWidth: "40ch" }}>
              We read every audit ourselves. You'll hear from us within 48 hours — typically with a written read-back of what we noticed, and a call link if we think there's a fit.
            </p>

            <div style={{ marginTop: 56, paddingTop: 32, borderTop: "1px solid rgba(235,232,226,0.15)" }}>
              <div className="mono" style={{ color: "var(--paper-3)", marginBottom: 14 }}>If you'd rather not wait</div>
              <a href="mailto:hellobloompartners@gmail.com" className="btn" style={{
                background: "var(--accent-2)", borderColor: "var(--accent-2)", color: "var(--ink)",
              }}>
                Book a 30-minute call <span className="arrow">→</span>
              </a>
            </div>

            <button onClick={onRestart} className="mono" style={{
              marginTop: 40, background: "none", border: "none",
              color: "var(--paper-3)", cursor: "pointer", padding: 0,
              borderBottom: "1px solid var(--paper-3)",
            }}>
              ← Edit my answers
            </button>
          </div>

          <div style={{ border: "1px solid rgba(235,232,226,0.2)", padding: 32 }}>
            <div className="mono" style={{ color: "var(--paper-3)", marginBottom: 20 }}>Your read-back, in summary</div>
            <Summary answers={answers} />
          </div>
        </div>
      </div>
    </section>
  );
}

function Audit() {
  const [step, setStep] = useState(-1);
  const [answers, setAnswers] = useState({});
  const [submitted, setSubmitted] = useState(false);
  const [submitting, setSubmitting] = useState(false);

  const total = QUESTIONS.length;
  const q = step >= 0 && step < total ? QUESTIONS[step] : null;

  const setAnswer = (id, value) => setAnswers(prev => ({ ...prev, [id]: value }));

  const handleNext = async () => {
    if (step === total - 1) {
      setSubmitting(true);
      const contact = answers.contact || {};
      try {
        await fetch("/", {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: new URLSearchParams({
            "form-name": "bloom-audit",
            name: contact.name || "",
            email: contact.email || "",
            school: contact.school || "",
            city: contact.city || "",
            school_type: answers.school_type || "",
            centres: answers.centres || "",
            students: answers.students || "",
            operating_years: answers.operating_years || "",
            differentiation: answers.differentiation || "",
            enrollment_trend: answers.enrollment_trend || "",
            scale_vision: answers.scale_vision || "",
            obstacle: answers.obstacle || "",
            next_location: answers.next_location || "",
            independent_leaders: answers.independent_leaders || "",
            business_expertise: answers.business_expertise || "",
            ops_expertise: answers.ops_expertise || "",
            academic_leadership: answers.academic_leadership || "",
            finance_clarity: String(answers.finance_clarity ?? ""),
            data_usage: String(answers.data_usage ?? ""),
            tech_support: String(answers.tech_support ?? ""),
            systems_codified: String(answers.systems_codified ?? ""),
          }).toString(),
        });
      } catch (e) {
        console.error("Submission error:", e);
      }
      setSubmitting(false);
      setSubmitted(true);
    } else {
      setStep(s => s + 1);
    }
  };

  const canAdvance = useMemo(() => {
    if (!q) return true;
    const a = answers[q.id];
    if (q.type === "contact") return a && a.name && a.email && /\S+@\S+\.\S+/.test(a.email);
    if (q.type === "slider") return true;
    if (q.type === "textarea") return true;
    if (q.type === "multi") return Array.isArray(a) && a.length > 0;
    if (q.type === "text") return a && a.trim().length > 2;
    if (q.type === "choice") return !!a;
    return true;
  }, [q, answers]);

  if (submitted) {
    return <AuditComplete answers={answers} onRestart={() => { setAnswers({}); setStep(-1); setSubmitted(false); }} />;
  }

  return (
    <section id="audit" style={{ padding: "140px 0", background: "var(--paper-2)", borderTop: "1px solid var(--line-soft)" }}>
      <div className="wrap">
        <div className="audit-grid" style={{
          display: "grid",
          gridTemplateColumns: "1fr 1.6fr",
          gap: 80,
          alignItems: "start",
        }}>
          {/* Left: index column */}
          <div className="audit-sticky" style={{ position: "sticky", top: 100 }}>
            <SectionLabel num="05" label="The audit" />
            <h2 style={{
              fontFamily: "var(--serif)", fontWeight: 400,
              fontSize: "clamp(36px, 4vw, 56px)", lineHeight: 1.05,
              letterSpacing: "-0.02em",
              margin: "32px 0 0",
              textWrap: "balance",
            }}>
              Five minutes. <em style={{ color: "var(--accent)" }}>Honest answers.</em>
            </h2>
            <p style={{ marginTop: 20, color: "var(--ink-2)", fontSize: 16, lineHeight: 1.6, maxWidth: "36ch" }}>
              Take the audit. It helps you understand us, and us understand you. If you like what you see at the end, book a call.
            </p>

            <div style={{ marginTop: 56, borderTop: "1px solid var(--line)", paddingTop: 20 }}>
              {SECTION_ORDER.map((s, i) => {
                const sectionFirstIdx = QUESTIONS.findIndex(qq => qq.section === s);
                const sectionLastIdx = QUESTIONS.length - 1 - [...QUESTIONS].reverse().findIndex(qq => qq.section === s);
                const isActive = step >= sectionFirstIdx && step <= sectionLastIdx;
                const isPast = step > sectionLastIdx || submitted;
                return (
                  <div key={s} style={{
                    display: "grid", gridTemplateColumns: "32px 1fr auto",
                    padding: "12px 0",
                    borderBottom: i < SECTION_ORDER.length - 1 ? "1px solid var(--line-soft)" : "none",
                    color: isActive ? "var(--ink)" : "var(--ink-3)",
                  }}>
                    <span className="mono" style={{ color: isActive ? "var(--accent)" : undefined }}>
                      {String(i + 1).padStart(2, "0")}
                    </span>
                    <span style={{
                      fontFamily: "var(--serif)", fontSize: 18,
                      fontStyle: isActive ? "italic" : "normal",
                    }}>{s}</span>
                    <span className="mono">{isPast ? "✓" : isActive ? "···" : ""}</span>
                  </div>
                );
              })}
            </div>
          </div>

          {/* Right: card */}
          <div id="audit-card" className="audit-card" style={{
            background: "var(--paper)",
            border: "1px solid var(--line)",
            minHeight: 560,
            display: "flex", flexDirection: "column",
          }}>
            <div className="audit-nav" style={{
              padding: "16px 32px",
              borderBottom: "1px solid var(--line-soft)",
            }}>
              <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 10 }}>
                <span className="mono" style={{ fontSize: 10 }}>
                  {step < 0 ? "The audit" : q ? q.section : ""}
                </span>
                <span className="mono" style={{ fontSize: 10 }}>
                  {step < 0 ? `${total} questions` : `Q ${step + 1} / ${total}`}
                </span>
              </div>
              <ProgressBar step={Math.max(step, 0)} total={total} />
            </div>

            <div className="audit-inner" style={{ padding: "56px 56px 32px", flex: 1, display: "flex", flexDirection: "column" }}>
              {step < 0 && <AuditIntro onStart={() => setStep(0)} />}
              {q && (
                <QuestionView q={q} value={answers[q.id]} setValue={(v) => setAnswer(q.id, v)} />
              )}
            </div>

            {step >= 0 && (
              <div style={{
                padding: "20px 32px",
                borderTop: "1px solid var(--line-soft)",
                display: "flex", alignItems: "center", justifyContent: "space-between",
              }}>
                <button onClick={() => setStep(s => Math.max(-1, s - 1))} className="mono"
                  style={{ background: "none", border: "none", cursor: "pointer", color: "var(--ink-3)", padding: "8px 0" }}>
                  ← Back
                </button>
                <button className="btn" disabled={!canAdvance || submitting}
                  onClick={handleNext}
                  style={{ opacity: canAdvance && !submitting ? 1 : 0.35, cursor: canAdvance && !submitting ? "pointer" : "not-allowed", padding: "12px 22px" }}>
                  {step === total - 1 ? (submitting ? "Sending…" : "Submit audit") : "Continue"}
                  {!submitting && <span className="arrow">→</span>}
                </button>
              </div>
            )}
          </div>
        </div>
      </div>
    </section>
  );
}

/* ─── Footer ──────────────────────────────────────────────────────────────── */

function Footer() {
  return (
    <footer style={{ background: "var(--surface-dark)", color: "var(--paper)", padding: "120px 0 48px" }}>
      <div className="wrap">
        <h2 style={{
          fontFamily: "var(--serif)", fontWeight: 300,
          fontSize: "clamp(56px, 9vw, 144px)",

          margin: 0,
          textWrap: "balance"
        }}>
          Backing India's best <em style={{ color: "var(--accent-2)", fontWeight: 400 }}>founder-led preschools.</em>
        </h2>

        <div className="footer-grid" style={{
          marginTop: 96,
          display: "grid", gridTemplateColumns: "1fr 1fr 1fr 1fr",
          gap: 48,
          paddingTop: 40,
          borderTop: "1px solid rgba(235,232,226,0.2)"
        }}>
          <div>
            <div className="mono" style={{ color: "var(--paper-3)", marginBottom: 14 }}>Contact</div>
            <a href="mailto:hellobloompartners@gmail.com" style={{ fontFamily: "var(--serif)", fontSize: 18, textDecoration: "none" }}>
              hellobloompartners@gmail.com
            </a>
          </div>
          <div>
            <div className="mono" style={{ color: "var(--paper-3)", marginBottom: 14 }}>Engagements</div>
            <div style={{ fontFamily: "var(--serif)", fontSize: 18 }}>A handful, each year</div>
          </div>
          <div>
            <div className="mono" style={{ color: "var(--paper-3)", marginBottom: 14 }}>Currently</div>
            <div style={{ fontFamily: "var(--serif)", fontSize: 18 }}>Open to first audits</div>
          </div>
          <div>
            <div className="mono" style={{ color: "var(--paper-3)", marginBottom: 14 }}>Begin</div>
            <a href="#audit" style={{
              fontFamily: "var(--serif)", fontSize: 18,
              textDecoration: "underline", textUnderlineOffset: "0.15em",
              textDecorationColor: "var(--accent-2)"
            }}>Take the 5-minute audit →</a>
          </div>
        </div>

        <div className="footer-bottom" style={{
          marginTop: 96, paddingTop: 24,
          borderTop: "1px solid rgba(235,232,226,0.1)",
          display: "flex", justifyContent: "space-between",
          color: "var(--paper-3)"
        }}>
          <span className="mono">© 2025 Bloom Partners — All rights reserved</span>
          <span className="mono">Based in Bangalore</span>
        </div>
      </div>
    </footer>
  );
}

/* ─── App root ────────────────────────────────────────────────────────────── */

function App() {
  useEffect(() => {
    const els = document.querySelectorAll('section, footer');
    const obs = new IntersectionObserver(
      entries => entries.forEach(e => {
        if (e.isIntersecting) { e.target.classList.add('visible'); obs.unobserve(e.target); }
      }),
      { threshold: 0.07, rootMargin: "0px 0px -40px 0px" }
    );
    els.forEach(el => { el.classList.add('fade-section'); obs.observe(el); });
    return () => obs.disconnect();
  }, []);

  return (
    <>
      <TopNav />
      <Hero />
      <Premise />
      <Patterns />
      <WhatWeDo />
      <WhatWeLookFor />
      <Audit />
      <Footer />
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
